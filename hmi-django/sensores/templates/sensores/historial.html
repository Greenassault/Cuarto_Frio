<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historial - Cuarto frío</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    h1 { margin: 0; }
    h2 { margin: 0 0 12px; font-size: 1.2rem; color: #cbd5e1; }
    .enlace {
      color: #e2e8f0; background: #1e293b; padding: 10px 16px;
      border-radius: 8px; text-decoration: none; white-space: nowrap;
    }
    .enlace:hover { background: #334155; }
    .bloque { background: #1e293b; border-radius: 12px; padding: 20px; margin-top: 16px; }
    .controles { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .controles label { display: flex; flex-direction: column; font-size: 0.85rem; color: #94a3b8; gap: 4px; }
    button, input, select {
      font: inherit; color: #e2e8f0; background: #0f172a;
      border: 1px solid #334155; border-radius: 8px; padding: 8px 12px;
    }
    button { cursor: pointer; }
    button:hover { background: #334155; }
    button.activo { background: #2563eb; border-color: #2563eb; }
    .grupo { display: flex; gap: 8px; flex-wrap: wrap; }
    #mensaje { margin-top: 12px; color: #fca5a5; }
    .resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 16px; }
    .dato { background: #1e293b; border-radius: 12px; padding: 16px; }
    .dato h3 { margin: 0 0 8px; font-size: 0.95rem; color: #94a3b8; }
    .dato .grande { font-size: 1.6rem; font-weight: 700; }
    .dato .chico { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; }
    .grafica { position: relative; height: 420px; }
    .encabezado-grafica { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .encabezado-grafica h2 { margin: 0; }
    .leyenda-hueco { color: #fca5a5; font-size: 0.85rem; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid #334155; }
    th:first-child, td:first-child { text-align: left; }
    th { color: #94a3b8; font-weight: 600; position: sticky; top: 0; background: #1e293b; }
    .scroll { max-height: 420px; overflow: auto; }
    .vacio { color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <h1>Historial</h1>
    <a class="enlace" href="/">Volver al panel</a>
  </header>

  <div class="bloque">
    <div class="controles">
      <div class="grupo" id="rangos">
        <button data-horas="1">Última hora</button>
        <button data-horas="24" class="activo">24 horas</button>
        <button data-horas="168">7 días</button>
        <button data-horas="720">30 días</button>
      </div>
      <label>Desde <input type="datetime-local" id="desde"></label>
      <label>Hasta <input type="datetime-local" id="hasta"></label>
      <button id="consultar">Consultar rango</button>
      <label>Hueco si no hay datos por más de
        <select id="umbral">
          <option value="60">1 minuto</option>
          <option value="300" selected>5 minutos</option>
          <option value="900">15 minutos</option>
          <option value="3600">1 hora</option>
        </select>
      </label>
    </div>
    <div id="mensaje"></div>
  </div>

  <div class="resumen" id="resumen"></div>

  <div class="bloque">
    <div class="encabezado-grafica">
      <h2>Gráfica</h2>
      <div class="grupo" id="variables">
        <button data-var="temp" class="activo">Temperatura</button>
        <button data-var="hum">Humedad</button>
      </div>
    </div>
    <div class="grafica"><canvas id="grafica"></canvas></div>
    <div class="leyenda-hueco">Las franjas rojas son huecos: periodos sin datos, posible apagón o desconexión.</div>
  </div>

  <div class="bloque">
    <h2>Huecos detectados</h2>
    <div id="huecos"></div>
  </div>

  <div class="bloque">
    <h2 id="titulo-tabla">Lecturas</h2>
    <div class="scroll"><div id="tabla"></div></div>
  </div>

  <script>
    let datos = null;
    let presetHoras = 24;
    let variable = "temp";
    let grafica = null;

    const COLOR_1 = "#38bdf8";
    const COLOR_2 = "#fbbf24";

    function fmt(iso) {
      return new Date(iso).toLocaleString("es-MX", {
        day: "numeric", month: "short",
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
      });
    }

    function duracion(seg) {
      const h = Math.floor(seg / 3600);
      const m = Math.floor((seg % 3600) / 60);
      const s = seg % 60;
      if (h) return h + " h " + m + " min";
      if (m) return m + " min " + s + " s";
      return s + " s";
    }

    function aInput(d) {
      const p = (n) => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
        "T" + p(d.getHours()) + ":" + p(d.getMinutes());
    }

    function num(v) {
      return v === null || v === undefined ? "--" : v.toFixed(1);
    }

    async function consultar(desde, hasta) {
      const mensaje = document.getElementById("mensaje");
      mensaje.textContent = "";
      document.getElementById("desde").value = aInput(desde);
      document.getElementById("hasta").value = aInput(hasta);

      const umbral = document.getElementById("umbral").value;
      const url = "/api/historial/?desde=" + encodeURIComponent(desde.toISOString()) +
        "&hasta=" + encodeURIComponent(hasta.toISOString()) +
        "&umbral=" + umbral;
      try {
        const resp = await fetch(url);
        if (!resp.ok) {
          mensaje.textContent = "No se pudo consultar ese rango. Revisa que 'Desde' sea anterior a 'Hasta'.";
          return;
        }
        datos = await resp.json();
        pintar();
      } catch (e) {
        mensaje.textContent = "No se pudo conectar con el servidor.";
      }
    }

    function consultarPreset(horas) {
      presetHoras = horas;
      const hasta = new Date();
      const desde = new Date(hasta.getTime() - horas * 3600 * 1000);
      consultar(desde, hasta);
    }

    function pintar() {
      pintarResumen();
      pintarGrafica();
      pintarHuecos();
      pintarTabla();
    }

    function pintarResumen() {
      const r = datos.resumen;
      const mayor = datos.huecos.reduce((m, h) => Math.max(m, h.segundos), 0);
      const reducido = datos.paso > 1 ? "Gráfica con 1 de cada " + datos.paso + " lecturas" : "Todas las lecturas en la gráfica";
      document.getElementById("resumen").innerHTML =
        '<div class="dato"><h3>Lecturas en el rango</h3><div class="grande">' + datos.total +
        '</div><div class="chico">' + reducido + '</div></div>' +
        '<div class="dato"><h3>Huecos</h3><div class="grande">' + datos.huecos.length +
        '</div><div class="chico">' + (mayor ? "El mayor: " + duracion(mayor) : "Sin pausas largas") + '</div></div>' +
        '<div class="dato"><h3>Cuarto frío 1 (°C)</h3><div class="grande">' + num(r.temp_1_prom) +
        ' prom.</div><div class="chico">mín ' + num(r.temp_1_min) + ' · máx ' + num(r.temp_1_max) + '</div></div>' +
        '<div class="dato"><h3>Cuarto frío 2 (°C)</h3><div class="grande">' + num(r.temp_2_prom) +
        ' prom.</div><div class="chico">mín ' + num(r.temp_2_min) + ' · máx ' + num(r.temp_2_max) + '</div></div>';
    }

    // indice dentro de cada punto: [fecha, temp_1, hum_1, temp_2, hum_2]
    function serie(indice) {
      const inicios = datos.huecos.map((h) => new Date(h.desde).getTime());
      const pts = [];
      let previo = null;
      for (const p of datos.puntos) {
        const x = new Date(p[0]).getTime();
        // Si entre dos puntos empieza un hueco, se corta la línea
        if (previo !== null && inicios.some((h) => h >= previo && h < x)) {
          pts.push({ x: (previo + x) / 2, y: null });
        }
        pts.push({ x: x, y: p[indice] });
        previo = x;
      }
      return pts;
    }

    const sombreaHuecos = {
      id: "sombreaHuecos",
      beforeDatasetsDraw(chart) {
        if (!datos) return;
        const { ctx, chartArea, scales } = chart;
        ctx.save();
        ctx.fillStyle = "rgba(239, 68, 68, 0.28)";
        for (const h of datos.huecos) {
          let x1 = scales.x.getPixelForValue(new Date(h.desde).getTime());
          let x2 = scales.x.getPixelForValue(new Date(h.hasta).getTime());
          x1 = Math.max(x1, chartArea.left);
          x2 = Math.min(x2, chartArea.right);
          if (x2 > x1) {
            ctx.fillRect(x1, chartArea.top, x2 - x1, chartArea.bottom - chartArea.top);
          }
        }
        ctx.restore();
      }
    };

    function pintarGrafica() {
      const esTemp = variable === "temp";
      const unidad = esTemp ? "°C" : "%";
      const i1 = esTemp ? 1 : 2;
      const i2 = esTemp ? 3 : 4;

      if (grafica) grafica.destroy();
      grafica = new Chart(document.getElementById("grafica"), {
        type: "line",
        data: {
          datasets: [
            { label: "Cuarto frío 1", data: serie(i1), borderColor: COLOR_1, borderWidth: 2, pointRadius: 0, tension: 0.2, spanGaps: false },
            { label: "Cuarto frío 2", data: serie(i2), borderColor: COLOR_2, borderWidth: 2, pointRadius: 0, tension: 0.2, spanGaps: false }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          interaction: { mode: "nearest", axis: "x", intersect: false },
          scales: {
            x: {
              type: "linear",
              min: new Date(datos.desde).getTime(),
              max: new Date(datos.hasta).getTime(),
              ticks: {
                color: "#94a3b8",
                maxTicksLimit: 8,
                callback: (v) => new Date(v).toLocaleString("es-MX", {
                  day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hour12: false
                })
              },
              grid: { color: "#334155" }
            },
            y: {
              title: { display: true, text: unidad, color: "#94a3b8" },
              ticks: { color: "#94a3b8" },
              grid: { color: "#334155" }
            }
          },
          plugins: {
            legend: { labels: { color: "#e2e8f0" } },
            tooltip: {
              callbacks: {
                title: (items) => fmt(items[0].parsed.x),
                label: (item) => item.dataset.label + ": " + item.parsed.y + " " + unidad
              }
            }
          }
        },
        plugins: [sombreaHuecos]
      });
    }

    function pintarHuecos() {
      const cont = document.getElementById("huecos");
      if (datos.huecos.length === 0) {
        cont.innerHTML = '<div class="vacio">Sin huecos: no hubo pausas mayores al umbral elegido.</div>';
        return;
      }
      let filas = "";
      for (const h of datos.huecos) {
        filas += "<tr><td>" + fmt(h.desde) + "</td><td>" + fmt(h.hasta) +
          "</td><td>" + duracion(h.segundos) + "</td></tr>";
      }
      cont.innerHTML = "<table><thead><tr><th>Último dato antes</th><th>Primer dato después</th><th>Duración</th></tr></thead><tbody>" +
        filas + "</tbody></table>";
    }

    function pintarTabla() {
      const cont = document.getElementById("tabla");
      const titulo = document.getElementById("titulo-tabla");
      if (datos.ultimas.length === 0) {
        titulo.textContent = "Lecturas";
        cont.innerHTML = '<div class="vacio">Sin lecturas en este rango.</div>';
        return;
      }
      titulo.textContent = "Lecturas más recientes del rango (" + datos.ultimas.length + " de " + datos.total + ")";
      const si = (b) => (b ? "Sí" : "No");
      let filas = "";
      for (const l of datos.ultimas) {
        filas += "<tr><td>" + fmt(l.recibido_en) + "</td>" +
          "<td>" + l.temp_1.toFixed(1) + "</td><td>" + l.hum_1.toFixed(1) + "</td><td>" + si(l.presencia_1) + "</td>" +
          "<td>" + l.temp_2.toFixed(1) + "</td><td>" + l.hum_2.toFixed(1) + "</td><td>" + si(l.presencia_2) + "</td></tr>";
      }
      cont.innerHTML = "<table><thead><tr><th>Hora</th>" +
        "<th>Temp. 1 (°C)</th><th>Hum. 1 (%)</th><th>Presencia 1</th>" +
        "<th>Temp. 2 (°C)</th><th>Hum. 2 (%)</th><th>Presencia 2</th></tr></thead><tbody>" +
        filas + "</tbody></table>";
    }

    // Botones de rango rápido
    document.querySelectorAll("#rangos button").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll("#rangos button").forEach((x) => x.classList.remove("activo"));
        b.classList.add("activo");
        consultarPreset(Number(b.dataset.horas));
      });
    });

    // Rango personalizado
    document.getElementById("consultar").addEventListener("click", () => {
      const d = document.getElementById("desde").value;
      const h = document.getElementById("hasta").value;
      if (!d || !h) {
        document.getElementById("mensaje").textContent = "Elige las dos fechas.";
        return;
      }
      document.querySelectorAll("#rangos button").forEach((x) => x.classList.remove("activo"));
      presetHoras = null;
      consultar(new Date(d), new Date(h));
    });

    // Cambiar entre temperatura y humedad
    document.querySelectorAll("#variables button").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll("#variables button").forEach((x) => x.classList.remove("activo"));
        b.classList.add("activo");
        variable = b.dataset.var;
        if (datos) pintarGrafica();
      });
    });

    // Cambiar el umbral vuelve a consultar el mismo rango
    document.getElementById("umbral").addEventListener("change", () => {
      const d = document.getElementById("desde").value;
      const h = document.getElementById("hasta").value;
      if (d && h) consultar(new Date(d), new Date(h));
    });

    consultarPreset(24);
    setInterval(() => {
      const el = document.activeElement;
      const editando = el && (el.tagName === "INPUT" || el.tagName === "SELECT");
      if (presetHoras && !editando) consultarPreset(presetHoras);
    }, 30000);
  </script>
</body>
</html>
